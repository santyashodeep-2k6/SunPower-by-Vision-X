# =============================================================================
# APPLICATION CONFIGURATION: SunFlow 360 Backend
# =============================================================================

spring:
  application:
    name: sunflow-api

  # PostgreSQL Data Source
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sunflow_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false

server:
  port: ${PORT:8081}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Logging
logging:
  level:
    com.visionx.sunflow: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
