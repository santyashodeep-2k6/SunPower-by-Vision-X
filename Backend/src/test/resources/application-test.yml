# Test profile — uses H2 in-memory database, never touches PostgreSQL
spring:
  datasource:
    url: jdbc:h2:mem:sunflow_test_${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

logging:
  level:
    com.visionx.sunflow: DEBUG
